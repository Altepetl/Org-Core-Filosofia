<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Logotipo Altepetl">
  <title>Altepetl — Logotipo futurista 3D</title>
  <desc>Glifo mexica del altepetl (agua y cerro) reinterpretado en estilo futurista 3D: cerro acampanado de cumbre redondeada (obsidiana y jade) atravesado por un canal de agua neón con voluta y chalchihuites.</desc>

  <defs>
    <radialGradient id="bgG" cx="0.5" cy="0.40" r="0.78">
      <stop offset="0" stop-color="#121a3a"/>
      <stop offset="0.55" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>

    <linearGradient id="ringG" x1="140" y1="40" x2="884" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#45e0ff"/>
      <stop offset="0.5" stop-color="#14e0a3"/>
      <stop offset="1" stop-color="#7dffd4"/>
    </linearGradient>

    <linearGradient id="gLit" x1="360" y1="220" x2="600" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cf3c4"/>
      <stop offset="1" stop-color="#0e7a5e"/>
    </linearGradient>
    <linearGradient id="gMid" x1="430" y1="240" x2="640" y2="648" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fb792"/>
      <stop offset="1" stop-color="#0a4a44"/>
    </linearGradient>
    <linearGradient id="gFront" x1="380" y1="430" x2="620" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27a284"/>
      <stop offset="1" stop-color="#0b3d3a"/>
    </linearGradient>
    <linearGradient id="gDark" x1="520" y1="220" x2="800" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d6480"/>
      <stop offset="1" stop-color="#0a2740"/>
    </linearGradient>
    <linearGradient id="gDarker" x1="600" y1="300" x2="820" y2="648" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#134567"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>

    <linearGradient id="waterG" x1="322" y1="560" x2="720" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ff4ff"/>
      <stop offset="0.45" stop-color="#35d6ff"/>
      <stop offset="1" stop-color="#18a0ff"/>
    </linearGradient>

    <radialGradient id="gemG" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#eafff8"/>
      <stop offset="0.35" stop-color="#52ffd0"/>
      <stop offset="1" stop-color="#0a7a5c"/>
    </radialGradient>

    <radialGradient id="glossG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eafff8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eafff8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="txtG" x1="0" y1="706" x2="0" y2="768" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.55" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#4fc8f5"/>
    </linearGradient>

    <filter id="fGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fGlowBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fBlur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="fBlur20"><feGaussianBlur stdDeviation="20"/></filter>

    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#b8741a" stop-opacity="0"/>
    </radialGradient>

    <!-- Silueta del cerro: falda ancha que sube y se redondea en cúpula
         (perfil acampanado del glifo tepētl, sin punta piramidal),
         con hombrillo redondeado a la derecha -->
    <clipPath id="clipMonte">
      <path d="M272 648
               C300 570 340 495 375 444
               C410 393 430 360 452 316
               C468 284 494 242 530 238
               C566 242 592 284 608 316
               C622 344 634 358 650 364
               C664 369 676 362 690 348
               C702 336 716 340 726 360
               C740 386 748 470 758 552
               C766 600 776 624 788 648 Z"/>
    </clipPath>
  </defs>

  <!-- ===== Emblema hexagonal ===== -->
  <g stroke-linejoin="round">
    <path d="M512 40 L884 255 L884 685 L512 900 L140 685 L140 255 Z"
          fill="url(#bgG)" stroke="url(#ringG)" stroke-width="9"/>
    <path d="M512 66 L862 268 L862 672 L512 874 L162 672 L162 268 Z"
          fill="none" stroke="#45e0ff" stroke-width="2" opacity="0.30"/>
  </g>

  <!-- nodos en los vértices -->
  <g fill="#14e0a3" filter="url(#fGlow)">
    <circle cx="512" cy="40" r="8"/>
    <circle cx="884" cy="255" r="7"/>
    <circle cx="140" cy="255" r="7"/>
    <circle cx="884" cy="685" r="6" opacity="0.8"/>
    <circle cx="140" cy="685" r="6" opacity="0.8"/>
    <circle cx="512" cy="900" r="8"/>
  </g>

  <!-- anillo técnico discontinuo -->
  <circle cx="512" cy="452" r="335" fill="none" stroke="#45e0ff"
          stroke-width="2.5" stroke-dasharray="3 16" opacity="0.25"/>

  <!-- halo tras el cerro para separarlo del fondo -->
  <ellipse cx="540" cy="420" rx="240" ry="190" fill="#1b5e79" opacity="0.35" filter="url(#fBlur20)"/>

  <!-- sol (tonatiuh) asomando tras la cúpula -->
  <circle cx="528" cy="206" r="60" fill="url(#sunG)" opacity="0.95" filter="url(#fBlur8)"/>
  <circle cx="528" cy="206" r="30" fill="url(#sunG)"/>
  <circle cx="528" cy="206" r="42" fill="none" stroke="#ffd166" stroke-width="1.8" opacity="0.7"/>

  <!-- ===== Sombra del cerro ===== -->
  <ellipse cx="530" cy="658" rx="268" ry="24" fill="#000000" opacity="0.45" filter="url(#fBlur8)"/>

  <!-- ===== Cerro de cúpula redondeada (tepētl) ===== -->
  <g>
    <!-- cuerpo base -->
    <path d="M272 648 C300 570 340 495 375 444 C410 393 430 360 452 316
             C468 284 494 242 530 238 C566 242 592 284 608 316
             C622 344 634 358 650 364 C664 369 676 362 690 348
             C702 336 716 340 726 360 C740 386 748 470 758 552
             C766 600 776 624 788 648 Z" fill="url(#gMid)"/>

    <!-- sombreado facetado (recortado a la silueta) -->
    <g clip-path="url(#clipMonte)">
      <!-- falda izquierda iluminada -->
      <path d="M530 238 L452 316 L375 444 L272 648 L560 648 L545 470 Z" fill="url(#gLit)"/>
      <!-- flanco derecho en sombra -->
      <path d="M530 238 L620 340 L710 480 L770 648 L810 648 L810 200 L560 200 Z" fill="url(#gDark)"/>
      <!-- borde profundo derecho -->
      <path d="M735 555 L810 555 L810 660 L755 660 Z" fill="url(#gDarker)" opacity="0.9"/>
      <!-- banda frontal (falda verde) -->
      <path d="M410 525 L690 595 L720 660 L390 660 Z" fill="url(#gFront)" opacity="0.55"/>
      <!-- brillo especular de la cúpula -->
      <ellipse cx="492" cy="308" rx="52" ry="88" transform="rotate(-16 492 308)"
               fill="url(#glossG)" opacity="0.5"/>
      <!-- aristas de las facetas -->
      <g fill="none" stroke="#9ffcf0" stroke-width="1.5" opacity="0.30" stroke-linecap="round">
        <path d="M530 238 L545 470 L560 648"/>
        <path d="M530 238 L620 340 L710 480"/>
        <path d="M530 238 L468 302 L408 436"/>
        <path d="M608 316 L650 364"/>
      </g>
    </g>
    <!-- luz de borde sobre la silueta redondeada -->
    <path d="M272 648 C300 570 340 495 375 444 C410 393 430 360 452 316
             C468 284 494 242 530 238 C566 242 592 284 608 316
             C622 344 634 358 650 364 C664 369 676 362 690 348
             C702 336 716 340 726 360 C740 386 748 470 758 552
             C766 600 776 624 788 648 Z" fill="none" stroke="#b9ffe8"
          stroke-width="2" opacity="0.45"/>
  </g>

  <!-- ===== Canal de agua (ātl) ===== -->
  <g fill="none" stroke-linecap="round">
    <!-- halo -->
    <path d="M322 566 C372 512 428 596 490 552 C548 512 588 616 646 590 C670 580 678 608 688 626
             c26 6 30 34 4 38 c-22 4 -34 -18 -16 -30 c12 -8 26 0 22 12 c-3 9 -14 10 -16 2"
          stroke="#35d6ff" stroke-width="40" opacity="0.35" filter="url(#fBlur8)"/>
    <!-- cuerpo -->
    <path d="M322 566 C372 512 428 596 490 552 C548 512 588 616 646 590 C670 580 678 608 688 626"
          stroke="url(#waterG)" stroke-width="24" filter="url(#fGlow)"/>
    <!-- voluta -->
    <path d="M688 626 c26 6 30 34 4 38 c-22 4 -34 -18 -16 -30 c12 -8 26 0 22 12 c-3 9 -14 10 -16 2"
          stroke="url(#waterG)" stroke-width="18" filter="url(#fGlow)"/>
    <!-- núcleo luminoso -->
    <path d="M326 566 C374 514 428 594 490 552 C546 514 588 610 646 588 C668 579 674 604 686 624
             c22 6 26 28 4 32 c-18 3 -28 -15 -13 -25 c10 -7 21 0 18 10 c-2 8 -12 8 -13 2"
          stroke="#eaffff" stroke-width="7" opacity="0.9"/>
  </g>

  <!-- ===== Chalchihuites (gotas de jade) ===== -->
  <g filter="url(#fGlow)">
    <g transform="translate(316,470)">
      <path d="M0 -30 L10 -12 L-10 -12 Z" fill="#0a7a5c"/>
      <circle r="16" fill="url(#gemG)" stroke="#7dffe0" stroke-width="1.4"/>
    </g>
    <g transform="translate(740,470)">
      <path d="M0 -30 L10 -12 L-10 -12 Z" fill="#0a7a5c"/>
      <circle r="16" fill="url(#gemG)" stroke="#7dffe0" stroke-width="1.4"/>
    </g>
  </g>

  <!-- ===== Greca escalonada (xicalcoliuhqui) ===== -->
  <g fill="none" stroke="#14e0a3" stroke-width="3" opacity="0.55">
    <path d="M336 694 v-16 h18 v16 h18 v-16 h18 v16 h18"/>
    <path d="M616 694 v-16 h18 v16 h18 v-16 h18 v16 h18"/>
  </g>

  <!-- ===== WordMark ===== -->
  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
     text-anchor="middle" letter-spacing="16" font-size="68">
    <text x="518" y="748" fill="#03150f">ALTEPETL</text>
    <text x="514" y="744" fill="#0a3d33">ALTEPETL</text>
    <text x="512" y="742" fill="url(#txtG)" filter="url(#fGlow)">ALTEPETL</text>
  </g>
  <text x="513" y="788" font-family="Arial,Helvetica,sans-serif" font-size="21"
        letter-spacing="7" text-anchor="middle" fill="#9fd8ff" opacity="0.85">ATL · TEPETL</text>
</svg>
